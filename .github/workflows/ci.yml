name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --locked --group dev --group bench
      - name: Ruff
        run: uv run ruff check sqlite_modal examples benchmarks tests
      - name: Ruff format
        run: uv run ruff format --check sqlite_modal examples benchmarks tests
      - name: Ty
        run: uv run ty check sqlite_modal examples benchmarks tests
      - name: Pytest
        run: uv run pytest -q
