name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --group dev --group bench
      - name: Ruff
        run: uv run ruff check sqlite_modal examples benchmarks tests
      - name: Ty
        run: uv run ty check sqlite_modal examples benchmarks tests
      - name: Pytest
        run: uv run pytest -q
