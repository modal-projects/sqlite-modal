[project]
name = "sqlite-modal"
version = "0.2.0"
description = "Turso Sync on Modal — Sqlite.from_name + local turso.sync connections"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.2,<2",
    "pyturso==0.5.1",
]

[project.optional-dependencies]
bench = [
    "matplotlib>=3.11.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqlite_modal"]

[dependency-groups]
dev = [
    "sqlite-modal",
    "pytest>=8.0",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]
bench = [
    "sqlite-modal[bench]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["sqlite_modal", "examples", "benchmarks", "tests"]

[tool.ty.src]
include = ["sqlite_modal", "examples", "benchmarks", "tests"]
