[project]
name = "sqlite-modal"
version = "0.2.0"
description = "Named Turso Sync databases on Modal"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "modal>=1.5.2,<2",
    "pyturso==0.5.1",
]

[project.urls]
Homepage = "https://github.com/modal-projects/distributed-sqlite"
Repository = "https://github.com/modal-projects/distributed-sqlite"
Issues = "https://github.com/modal-projects/distributed-sqlite/issues"

[project.optional-dependencies]
bench = [
    "matplotlib>=3.11.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqlite_modal"]

[dependency-groups]
dev = [
    "sqlite-modal",
    "pytest>=8.0",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]
bench = [
    "sqlite-modal[bench]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["sqlite_modal", "examples", "benchmarks", "tests"]

[tool.ty.src]
include = ["sqlite_modal", "examples", "benchmarks", "tests"]
