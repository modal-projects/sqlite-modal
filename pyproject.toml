[project]
name = "sqlite-modal"
version = "0.1.0"
description = "Named SQLite on Modal Servers — one Volume per DB, HTTP SQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0,<1",
    "modal>=1.5.2,<2",
]

[project.optional-dependencies]
# Keep pins aligned with ``Server.PIP_PACKAGES`` in sqlite_modal/server.py.
server = [
    "fastapi[standard]>=0.139.0,<1",
    "uvicorn>=0.34.0,<1",
]
bench = [
    "matplotlib>=3.11.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqlite_modal"]

[dependency-groups]
dev = [
    "sqlite-modal[server,bench]",
    "pytest>=8.0",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["sqlite_modal", "examples", "benchmarks", "tests"]

[tool.ty.src]
include = ["sqlite_modal", "examples", "benchmarks", "tests"]
